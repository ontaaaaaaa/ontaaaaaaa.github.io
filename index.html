<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5ec8ff">
  <title>Ayo Tembak! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Patrick+Hand&family=Baloo+2:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Gambar yang dipakai ulang -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-hero" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5fb8ff"/>
        <stop offset="1" stop-color="#3a7fe0"/>
      </linearGradient>

      <!-- Maskot orisinal "Kiko" (diganti otomatis oleh assets/images/stitch.png bila ada) -->
      <symbol id="hero-core" viewBox="0 0 200 220">
        <ellipse cx="70" cy="202" rx="24" ry="12" fill="#3a7fe0" stroke="#1d4f9c" stroke-width="4"/>
        <ellipse cx="130" cy="202" rx="24" ry="12" fill="#3a7fe0" stroke="#1d4f9c" stroke-width="4"/>
        <ellipse cx="44" cy="88" rx="15" ry="22" fill="#5fb8ff" stroke="#1d4f9c" stroke-width="4" transform="rotate(-28 44 88)"/>
        <ellipse cx="156" cy="88" rx="15" ry="22" fill="#5fb8ff" stroke="#1d4f9c" stroke-width="4" transform="rotate(28 156 88)"/>
        <path d="M100 76 C98 58 112 50 116 38" fill="none" stroke="#1d4f9c" stroke-width="5" stroke-linecap="round"/>
        <path d="M117 22 L121 32 L132 33 L124 40 L127 51 L117 45 L107 51 L110 40 L102 33 L113 32 Z" fill="#ffd23f" stroke="#e09a12" stroke-width="2.5" stroke-linejoin="round"/>
        <ellipse cx="100" cy="140" rx="70" ry="66" fill="url(#g-hero)" stroke="#1d4f9c" stroke-width="4"/>
        <ellipse cx="100" cy="170" rx="40" ry="30" fill="#bfe4ff"/>
        <ellipse cx="74" cy="126" rx="15" ry="18" fill="#1c2340"/>
        <ellipse cx="126" cy="126" rx="15" ry="18" fill="#1c2340"/>
        <circle cx="79" cy="119" r="6" fill="#fff"/>
        <circle cx="131" cy="119" r="6" fill="#fff"/>
        <circle cx="70" cy="132" r="2.5" fill="#fff"/>
        <circle cx="122" cy="132" r="2.5" fill="#fff"/>
        <ellipse cx="54" cy="150" rx="11" ry="6" fill="#ff8fb8" opacity=".75"/>
        <ellipse cx="146" cy="150" rx="11" ry="6" fill="#ff8fb8" opacity=".75"/>
      </symbol>
      <symbol id="hero-sit" viewBox="0 0 200 220">
        <ellipse cx="34" cy="168" rx="14" ry="22" fill="#4a98f0" stroke="#1d4f9c" stroke-width="4" transform="rotate(24 34 168)"/>
        <ellipse cx="168" cy="160" rx="14" ry="22" fill="#4a98f0" stroke="#1d4f9c" stroke-width="4" transform="rotate(-50 168 160)"/>
        <use href="#hero-core"/>
        <path d="M88 150 Q100 162 112 150" fill="none" stroke="#1c2340" stroke-width="4" stroke-linecap="round"/>
      </symbol>
      <symbol id="hero-cheer" viewBox="0 0 200 220">
        <ellipse cx="22" cy="92" rx="13" ry="26" fill="#4a98f0" stroke="#1d4f9c" stroke-width="4" transform="rotate(-38 22 92)"/>
        <ellipse cx="178" cy="92" rx="13" ry="26" fill="#4a98f0" stroke="#1d4f9c" stroke-width="4" transform="rotate(38 178 92)"/>
        <use href="#hero-core"/>
        <path d="M84 148 Q100 176 116 148 Z" fill="#7a2245" stroke="#1c2340" stroke-width="3.5" stroke-linejoin="round"/>
        <path d="M92 160 Q100 154 108 160 Q104 168 100 168 Q96 168 92 160 Z" fill="#ff7aa5"/>
      </symbol>

      <symbol id="cloud" viewBox="0 0 160 70">
        <path d="M24 62 Q4 62 6 46 Q8 30 28 32 Q30 10 56 12 Q72 -4 94 10 Q118 2 126 26 Q154 24 154 46 Q154 62 134 62 Z" fill="#fff"/>
        <path d="M24 62 Q10 62 8 52 Q40 58 80 54 Q120 58 152 50 Q150 62 134 62 Z" fill="#d6ecff"/>
      </symbol>

      <symbol id="palm" viewBox="0 0 60 80">
        <path d="M30 80 Q26 50 34 24" stroke="#8a5a2e" stroke-width="5" fill="none" stroke-linecap="round"/>
        <g fill="#25a35e">
          <path d="M34 24 Q18 10 2 20 Q18 18 34 24Z"/>
          <path d="M34 24 Q48 8 60 18 Q46 18 34 24Z"/>
          <path d="M34 24 Q28 8 16 2 Q30 8 34 24Z"/>
          <path d="M34 24 Q42 6 52 2 Q40 10 34 24Z"/>
          <path d="M34 24 Q40 34 52 36 Q40 30 34 24Z"/>
          <path d="M34 24 Q24 32 12 36 Q24 28 34 24Z"/>
        </g>
      </symbol>

      <symbol id="frond" viewBox="0 0 200 160">
        <path d="M0 10 Q90 10 180 120" fill="none" stroke="#1e8a4f" stroke-width="5" stroke-linecap="round"/>
        <g fill="#2fb36b" stroke="#1e8a4f" stroke-width="2" stroke-linejoin="round">
          <path d="M20 10 Q34 40 22 70 Q30 38 20 10Z"/>
          <path d="M44 12 Q62 44 52 84 Q56 44 44 12Z"/>
          <path d="M70 18 Q90 52 82 98 Q84 52 70 18Z"/>
          <path d="M96 30 Q118 64 112 112 Q110 64 96 30Z"/>
          <path d="M122 48 Q142 80 140 126 Q134 80 122 48Z"/>
          <path d="M146 72 Q164 100 166 140 Q156 100 146 72Z"/>
          <path d="M30 10 Q58 0 74 -2 Q52 8 30 10Z"/>
          <path d="M60 14 Q92 2 112 6 Q86 14 60 14Z"/>
          <path d="M92 28 Q124 18 144 26 Q118 32 92 28Z"/>
          <path d="M118 46 Q150 40 168 52 Q142 54 118 46Z"/>
          <path d="M142 70 Q170 68 184 82 Q160 82 142 70Z"/>
        </g>
      </symbol>

      <symbol id="fish-shadow" viewBox="0 0 60 30">
        <path d="M4 15 Q16 2 36 8 L54 2 L50 15 L54 28 L36 22 Q16 28 4 15Z" fill="currentColor"/>
      </symbol>
      <symbol id="jelly-shadow" viewBox="0 0 40 50">
        <path d="M4 20 Q4 2 20 2 Q36 2 36 20 Z M8 22 Q6 36 10 48 M16 22 Q14 38 18 48 M24 22 Q22 38 26 48 M32 22 Q30 36 34 46" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </symbol>

      <symbol id="coral" viewBox="0 0 160 120">
        <path d="M20 120 Q14 70 30 40 M30 70 Q14 58 10 40 M30 56 Q44 40 40 20" stroke="#ff6fa5" stroke-width="10" fill="none" stroke-linecap="round"/>
        <path d="M70 120 Q74 80 62 50 M68 84 Q84 70 90 46 M66 64 Q52 54 50 36" stroke="#9b7bff" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M110 120 Q104 90 116 60 Q124 40 112 20 M114 70 Q132 62 136 44" stroke="#2fb36b" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M140 120 Q150 96 142 74 Q136 60 146 44" stroke="#25a35e" stroke-width="6" fill="none" stroke-linecap="round"/>
        <ellipse cx="94" cy="114" rx="22" ry="12" fill="#ff9a3c"/>
        <circle cx="86" cy="110" r="3" fill="#ffd8a8"/><circle cx="98" cy="108" r="3" fill="#ffd8a8"/><circle cx="104" cy="116" r="3" fill="#ffd8a8"/>
      </symbol>

      <symbol id="starfish" viewBox="0 0 60 60">
        <path d="M30 4 Q34 20 40 22 Q56 22 58 26 Q46 34 44 40 Q50 54 46 56 Q36 48 30 48 Q24 48 14 56 Q10 54 16 40 Q14 34 2 26 Q4 22 20 22 Q26 20 30 4Z" fill="#ff7a4a" stroke="#d24d22" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="30" cy="30" r="2.5" fill="#ffc29a"/><circle cx="30" cy="18" r="2" fill="#ffc29a"/><circle cx="42" cy="28" r="2" fill="#ffc29a"/><circle cx="18" cy="28" r="2" fill="#ffc29a"/>
      </symbol>

      <symbol id="hand-icon" viewBox="0 0 80 90">
        <g stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none">
          <path d="M30 4 V12 M12 14 L18 20 M48 14 L42 20"/>
        </g>
        <path d="M24 30 Q24 20 31 20 Q38 20 38 30 V48 Q40 42 46 42 Q52 42 52 50 Q55 45 60 46 Q66 48 65 56 Q68 52 72 54 Q76 57 75 64 V72 Q74 86 58 88 H40 Q30 88 24 78 L10 58 Q6 50 12 48 Q18 46 24 56 Z" fill="#fff" stroke="#1d4f9c" stroke-width="4" stroke-linejoin="round"/>
      </symbol>
    </defs>
  </svg>

  <button id="mute" class="mute" type="button" aria-label="Matikan suara">🔊</button>

  <main id="game" class="game">
    <div class="sky"></div>
    <svg class="cloud c1" viewBox="0 0 160 70" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="cloud c2" viewBox="0 0 160 70" aria-hidden="true"><use href="#cloud"/></svg>
    <svg class="cloud c3" viewBox="0 0 160 70" aria-hidden="true"><use href="#cloud"/></svg>

    <div class="sea"></div>
    <svg class="island island-r" viewBox="0 0 200 70" aria-hidden="true">
      <ellipse cx="110" cy="64" rx="96" ry="12" fill="#f6dc95"/>
      <path d="M40 60 Q60 36 90 44 Q120 30 150 44 Q176 40 190 60 Z" fill="#2fa35e"/>
      <svg x="62" y="0" width="40" height="56"><use href="#palm"/></svg>
      <svg x="100" y="-6" width="44" height="60"><use href="#palm"/></svg>
      <svg x="138" y="6" width="34" height="50"><use href="#palm"/></svg>
    </svg>
    <svg class="island island-l" viewBox="0 0 120 40" aria-hidden="true">
      <ellipse cx="60" cy="36" rx="56" ry="6" fill="#f6dc95"/>
      <path d="M20 34 Q40 18 64 24 Q90 18 104 34 Z" fill="#2fa35e"/>
      <svg x="40" y="0" width="26" height="34"><use href="#palm"/></svg>
    </svg>
    <div id="school" class="school" aria-hidden="true"></div>

    <svg class="coral coral-l" viewBox="0 0 160 120" aria-hidden="true"><use href="#coral"/></svg>
    <svg class="coral coral-r" viewBox="0 0 160 120" aria-hidden="true"><use href="#coral"/></svg>
    <div class="sand">
      <svg class="starfish" viewBox="0 0 60 60" aria-hidden="true"><use href="#starfish"/></svg>
      <i class="rock r1"></i><i class="rock r2"></i><i class="rock r3"></i>
    </div>

    <svg class="frond frond-l" viewBox="0 0 200 160" aria-hidden="true"><use href="#frond"/></svg>
    <svg class="frond frond-r" viewBox="0 0 200 160" aria-hidden="true"><use href="#frond"/></svg>

    <div id="animals" class="animals"></div>

    <div id="hero" class="hero hero-game"><svg viewBox="0 0 200 220" aria-hidden="true"><use href="#hero-sit"/></svg></div>

    <img id="cannon" class="cannon" src="assets/images/meriam.png" alt="" draggable="false">

    <div class="hud">
      <div id="counter" class="counter">Tap: 0/7</div>
      <div class="intro">
        <h1 class="title">Ayo<br>Tembak!</h1>
        <p class="subtitle">Tap layar 7 kali<br>untuk menembak<br>hewan laut!</p>
      </div>
    </div>

    <svg id="hand" class="hand" viewBox="0 0 80 90" aria-hidden="true"><use href="#hand-icon"/></svg>
    <p id="win-text" class="win-text">Yeay! Kamu Berhasil!</p>

    <div id="fx" class="fx"></div>
  </main>

  <!-- Intro: Stitch menyapa sebelum game dimulai -->
  <section id="opening" class="opening">
    <div class="opening-bubbles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="speech">
      <p class="speech-hi">Aloha, <span class="opening-name"></span>!</p>
      <p class="speech-msg">Hari ini hari spesialmu! Yuk, bantu aku menembak hewan laut!</p>
    </div>
    <img class="opening-stitch" src="assets/images/stitch-hello.png" alt="Stitch melambaikan tangan" draggable="false">
    <button class="start-btn" type="button">Ayo Main!</button>
  </section>

  <!-- Layar "Game Selesai" (dipasang setelah tap ke-4) -->
  <template id="finish-tpl">
    <section class="finish" aria-live="polite">
      <div class="night-stars"></div>
      <svg class="night-palm night-palm-l" viewBox="0 0 60 80" aria-hidden="true"><use href="#palm"/></svg>
      <svg class="night-palm night-palm-r" viewBox="0 0 60 80" aria-hidden="true"><use href="#palm"/></svg>
      <div class="night-ground"></div>
      <h1 class="finish-title"><span class="yeay">Yeay!</span><span>Game Selesai!</span></h1>
      <span class="finish-heart" aria-hidden="true">♥</span>
      <div class="hero hero-finish"><svg viewBox="0 0 200 220" aria-hidden="true"><use href="#hero-cheer"/></svg></div>
      <button class="next-btn" type="button">Lanjut <span aria-hidden="true">♥</span></button>
      <div class="fx"></div>
    </section>
  </template>

  <!-- Halaman ucapan (dipasang hanya setelah game selesai) -->
  <template id="birthday-tpl">
    <section class="birthday">
      <svg class="frond bday-frond-l" viewBox="0 0 200 160" aria-hidden="true"><use href="#frond"/></svg>
      <svg class="frond bday-frond-r" viewBox="0 0 200 160" aria-hidden="true"><use href="#frond"/></svg>
      <div class="card">
        <h1 class="bday-title"><span class="bday-title-text"></span> <span class="pink" aria-hidden="true">♥</span></h1>
        <div class="photo-wrap">
          <figure class="polaroid">
            <img class="photo" alt="">
            <figcaption class="bday-name"></figcaption>
          </figure>
          <div class="hero hero-bday"><svg viewBox="0 0 200 220" aria-hidden="true"><use href="#hero-cheer"/></svg></div>
          <span class="doodle d1" aria-hidden="true">♡</span>
          <span class="doodle d2" aria-hidden="true">♥</span>
          <span class="doodle d3" aria-hidden="true">♡</span>
          <span class="doodle d4" aria-hidden="true">♥</span>
        </div>
        <p class="bday-msg"></p>
        <span class="bday-heart" aria-hidden="true">♥</span>
        <button class="replay-btn" type="button" hidden>Main Lagi</button>
      </div>
      <div class="fx"></div>
    </section>
  </template>

  <div class="rotate-hint">Putar HP ke posisi tegak 📱</div>

  <script src="js/game.js"></script>
</body>
</html>
